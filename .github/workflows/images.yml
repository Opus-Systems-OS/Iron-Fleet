# Builds the two deployable images and pushes them to GHCR. The droplet
# (deploy/droplet/) only ever pulls; it never builds — 1 vCPU / 961 MB cannot
# do a Rust release build. Both Dockerfiles need the repo root as context.
name: images

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - control-plane/**
      - mcp-fleet/**
      - agents/**
      - worker/Cargo.toml
      - app/src-tauri/Cargo.toml
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            dockerfile: control-plane/Dockerfile
          - name: mcp-fleet
            dockerfile: mcp-fleet/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR wants a lowercase owner; github.repository_owner is "Opus-Systems-OS".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/opus-systems-os/iron-fleet/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
