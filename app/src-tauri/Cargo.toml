[package]
name = "app"
version = "0.1.0"
description = "Iron-Fleet desktop client (J.A.R.V.I.S.): Tauri shell, Fleet Dashboard"
edition.workspace = true
license.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"

# [profile.release] lives in the workspace root Cargo.toml — Cargo ignores a
# member crate's own profile tables and warns.

# macOS speech I/O (CLAUDE.md: platform-gated in src-tauri). Windows builds
# never see these; `speech/mod.rs` compiles the text-only stub there.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-speech = { version = "0.3", features = ["objc2-avf-audio"] }
block2 = "0.6"
