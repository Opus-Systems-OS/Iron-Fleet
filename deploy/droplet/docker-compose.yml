# Iron-Fleet on the opustower.dev droplet: Caddy in front of the two binaries
# we ship here plus the Opus Systems OS API (its own repo, same box). Images come from GHCR (.github/workflows/images.yml); this
# box never builds. Only Caddy publishes ports — the services are reachable
# solely through it, on the compose network.
#
# .env (chmod 600, never committed) is read by both services; each ignores
# the variables it doesn't know. See env.example for the full list.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane
      - mcp-fleet
      - api

  control-plane:
    image: ghcr.io/opus-systems-os/iron-fleet/control-plane:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/control-plane.db
    volumes:
      - cp_data:/data
    # No container healthcheck: the slim runtime image has neither curl nor
    # bash. `curl https://fleet.opustower.dev/healthz` through Caddy is the check.

  mcp-fleet:
    image: ghcr.io/opus-systems-os/iron-fleet/mcp-fleet:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8090"
      # Compose DNS; no reason to leave the box for the control plane.
      CONTROL_PLANE_URL: http://control-plane:8080
      # rmcp's DNS-rebinding guard 403s any Host it doesn't know; Caddy
      # forwards the public one unchanged.
      ALLOWED_HOSTS: mcp.opustower.dev
    depends_on:
      - control-plane

  # Opus Systems OS API — github.com/Opus-Systems-OS/Opus-Systems-OS-API.
  # The public front door; the control plane becomes its upstream. Holds
  # CONTROL_PLANE_TOKEN (already in .env) and its own keys DB, nothing else.
  api:
    image: ghcr.io/opus-systems-os/opus-systems-os-api/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8100"
      DATABASE_PATH: /data/opus-api.db
      CONTROL_PLANE_URL: http://control-plane:8080
    volumes:
      - api_data:/data
    depends_on:
      - control-plane

volumes:
  cp_data:
  api_data:
  caddy_data:
  caddy_config:
