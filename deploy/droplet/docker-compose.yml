# Iron-Fleet on the opustower.dev droplet: Caddy in front of the two binaries
# we ship here plus the Opus Systems OS API (its own repo, same box). Images come from GHCR (.github/workflows/images.yml); this
# box never builds. Only Caddy publishes ports — the services are reachable
# solely through it, on the compose network.
#
# .env (chmod 600, never committed) is read by both services; each ignores
# the variables it doesn't know. See env.example for the full list.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # `opuscad` is internal (no internet); Caddy joins it only to reach the worker.
    networks: [default, opuscad]
    depends_on:
      - control-plane
      - mcp-fleet
      - api
      - jarvis-web
      - opuscad-worker

  control-plane:
    image: ghcr.io/opus-systems-os/iron-fleet/control-plane:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/control-plane.db
    volumes:
      - cp_data:/data
    # No container healthcheck: the slim runtime image has neither curl nor
    # bash. `curl https://fleet.opustower.dev/healthz` through Caddy is the check.

  mcp-fleet:
    image: ghcr.io/opus-systems-os/iron-fleet/mcp-fleet:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8090"
      # Compose DNS; no reason to leave the box for the control plane.
      CONTROL_PLANE_URL: http://control-plane:8080
      # rmcp's DNS-rebinding guard 403s any Host it doesn't know; Caddy
      # forwards the public one unchanged.
      ALLOWED_HOSTS: mcp.opustower.dev
    depends_on:
      - control-plane

  # Opus Systems OS API — github.com/Opus-Systems-OS/Opus-Systems-OS-API.
  # The public front door; the control plane becomes its upstream. Holds
  # CONTROL_PLANE_TOKEN (already in .env) and its own keys DB, nothing else.
  api:
    image: ghcr.io/opus-systems-os/opus-systems-os-api/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8100"
      DATABASE_PATH: /data/opus-api.db
      CONTROL_PLANE_URL: http://control-plane:8080
    volumes:
      - api_data:/data
      # The ops panel's Docker row: the engine socket, read-only. The API
      # only ever GETs /containers/json over it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - control-plane

  # J.A.R.V.I.S. on the web — github.com/Opus-Systems-OS/J.A.R.V.I.S-Web.
  # The password gate and page at jarvis.opustower.dev, in front of the API.
  # No env_file on purpose: it gets its own variables and none of the
  # box's other secrets. The hash is single-quoted in .env ($ inside).
  # Its two osk_ keys are Docker secrets — 0400 files in ./secrets, mounted
  # at /run/secrets — so they never show in `docker inspect` or the
  # process environment (deploy.sh moves them out of .env once).
  # Unset values don't break the rest of the stack: jarvis-web alone
  # refuses to start and logs which variable is missing.
  # Locked down: read-only root, no capabilities, no privilege gain; it
  # writes only its SQLite volume and /tmp.
  jarvis-web:
    image: ghcr.io/opus-systems-os/jarvis-web:latest
    restart: unless-stopped
    environment:
      PORT: "8200"
      DATABASE_PATH: /data/jarvis-web.db
      OPUS_API_URL: http://api:8100
      WEB_API_KEY_FILE: /run/secrets/web_api_key
      JARVIS_WEB_PASSWORD_HASH: ${JARVIS_WEB_PASSWORD_HASH:-}
      # Mr. Powers's profile; optional, both or neither.
      WEB_POWERS_API_KEY_FILE: /run/secrets/web_powers_api_key
      # The Intel globe's ship layer (a free AISStream key).
      AISSTREAM_API_KEY_FILE: /run/secrets/aisstream_api_key
      JARVIS_WEB_POWERS_PASSWORD_HASH: ${JARVIS_WEB_POWERS_PASSWORD_HASH:-}
      # Each profile's own GitHub token for the Projects tab; an empty file
      # (deploy.sh makes one) just means no GitHub for that profile yet.
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      GITHUB_POWERS_TOKEN_FILE: /run/secrets/github_powers_token
      RUST_LOG: info,tower_http=info
    secrets:
      - web_api_key
      - web_powers_api_key
      - aisstream_api_key
      - github_token
      - github_powers_token
    volumes:
      - web_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api

  # OpusCAD — github.com/Opus-Systems-OS/OpusCad. Headless Blender that
  # Jarvis drives over MCP at cad.opustower.dev/mcp (models, Roblox exports,
  # STL for printing). The agent runs its own Python inside Blender, so the
  # worker sits alone on the internal `opuscad` network: no outbound internet,
  # read-only root, no capabilities, CPU/memory/process caps. Its bearer token
  # is a Docker secret that deploy.sh writes from OPUSCAD_TOKEN in .env (the
  # control plane also reads it there, for Jarvis's vault). No env_file.
  opuscad-worker:
    image: ghcr.io/opus-systems-os/opuscad-worker:latest
    restart: unless-stopped
    init: true
    environment:
      OPUSCAD_TOKEN_FILE: /run/secrets/opuscad_token
    secrets:
      - opuscad_token
    volumes:
      - opuscad_projects:/opt/opuscad/worker/vendor/RoForge/projects
    read_only: true
    tmpfs:
      - /tmp
      - /opt/opuscad/worker/vendor/RoForge/.runtime:uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    networks: [opuscad]

networks:
  opuscad:
    internal: true

secrets:
  web_api_key:
    file: ./secrets/web_api_key
  web_powers_api_key:
    file: ./secrets/web_powers_api_key
  aisstream_api_key:
    file: ./secrets/aisstream_api_key
  github_token:
    file: ./secrets/github_token
  github_powers_token:
    file: ./secrets/github_powers_token
  opuscad_token:
    file: ./secrets/opuscad_token

volumes:
  cp_data:
  api_data:
  web_data:
  opuscad_projects:
  caddy_data:
  caddy_config:
