[workspace]
resolver = "2"
# CLAUDE.md lists mcp-fleet and app/src-tauri as members too; they are added
# when their build stage starts. Stage 2 added worker/.
members = ["control-plane", "worker"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
