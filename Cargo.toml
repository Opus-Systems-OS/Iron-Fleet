[workspace]
resolver = "2"
# CLAUDE.md lists mcp-fleet as a member too; it's added last, once the
# surface it wraps has stopped moving. Stage 2 added worker/, stage 3 app/src-tauri.
members = ["control-plane", "worker", "app/src-tauri"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
